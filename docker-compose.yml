services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortexdocs
    volumes:
      - cortex_postgres_data:/var/lib/postgresql/data
      - ./database/schema.postgres.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://cortex:cortex@postgres:5432/cortexdocs
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  cortex_postgres_data:
