[package]
name = "cortexdocs_desktop"
version = "0.1.0"
description = "CortexDocs AI desktop app"
authors = ["CortexDocs AI"]
edition = "2021"

[lib]
name = "cortexdocs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
